[package]
name = "companyos-core"
description = "CompanyOS core service — dashboard (Phase 1.3) + workspace + auth + hello"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "companyos_core"
path = "src/lib.rs"

[[bin]]
name = "companyos-core"
path = "src/main.rs"

[dependencies]
companyos-ids = { workspace = true }
companyos-errors = { workspace = true }
companyos-telemetry = { workspace = true }
companyos-tenancy = { workspace = true }
companyos-events = { workspace = true }
companyos-outbox = { workspace = true }
companyos-authz = { workspace = true }
companyos-auth-token = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
anyhow = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
totp-rs = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
cookie = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
companyos-testkit = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
axum = { workspace = true }
