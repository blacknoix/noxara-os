[package]
name = "companyos-ai"
description = "CompanyOS AI assistant — Phase 1.9 copilot, proposals, retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "companyos_ai"
path = "src/lib.rs"

[[bin]]
name = "companyos-ai"
path = "src/main.rs"

[[example]]
name = "export_openapi"
path = "examples/export_openapi.rs"

[dependencies]
companyos-ids = { workspace = true }
companyos-errors = { workspace = true }
companyos-telemetry = { workspace = true }
companyos-tenancy = { workspace = true }
companyos-events = { workspace = true }
companyos-authz = { workspace = true }
companyos-auth-token = { workspace = true }
companyos-money = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
anyhow = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
bytes = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
companyos-testkit = { workspace = true }
companyos-core = { path = "../../core" }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
axum = { workspace = true }
