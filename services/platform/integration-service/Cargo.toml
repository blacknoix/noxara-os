[package]
name = "companyos-integration"
description = "CompanyOS integration service — outbound webhooks (3.3) and marketplace (3.4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "companyos_integration"
path = "src/lib.rs"

[[bin]]
name = "companyos-integration"
path = "src/main.rs"

[dependencies]
companyos-ids = { workspace = true }
companyos-errors = { workspace = true }
companyos-telemetry = { workspace = true }
companyos-tenancy = { workspace = true }
companyos-events = { workspace = true }
companyos-outbox = { workspace = true }
companyos-authz = { workspace = true }
companyos-auth-token = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
async-nats = { workspace = true }
url = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
aes-gcm = "0.10"
futures = { workspace = true }

[dev-dependencies]
companyos-testkit = { workspace = true }
companyos-core = { path = "../../core" }
companyos-outbox = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
axum = { workspace = true }
subtle = { workspace = true }
