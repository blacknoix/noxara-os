[package]
name = "companyos-outbox-relay"
description = "CompanyOS outbox → NATS JetStream relay (Phase 1.8)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "companyos_outbox_relay"
path = "src/lib.rs"

[[bin]]
name = "companyos-outbox-relay"
path = "src/main.rs"

[dependencies]
