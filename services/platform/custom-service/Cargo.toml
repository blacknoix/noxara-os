[package]
name = "companyos-custom"
description = "CompanyOS Low-code builder — Phase 4.4 (custom entities, formulas, scripts, packages)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "companyos_custom"
path = "src/lib.rs"

[[bin]]
name = "companyos-custom"
path = "src/main.rs"

[dependencies]
companyos-ids = { workspace = true }
companyos-money = { workspace = true }
companyos-errors = { workspace = true }
companyos-telemetry = { workspace = true }
companyos-tenancy = { workspace = true }
companyos-events = { workspace = true }
companyos-outbox = { workspace = true }
companyos-authz = { workspace = true }
companyos-auth-token = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
anyhow = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
companyos-testkit = { workspace = true }
companyos-core = { path = "../../core" }
companyos-integration = { path = "../integration-service" }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
axum = { workspace = true }
