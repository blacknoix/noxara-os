name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Bootstrap superuser is `postgres`. App/tests use non-superuser `companyos`
        # (superusers bypass RLS even with FORCE ROW LEVEL SECURITY).
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Notification / gateway rate-limit tests use Redis when REDIS_URL is set.
        # No secrets required; skip/gate paths that need live AI_API_KEY.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://companyos:companyos@127.0.0.1:5432/companyos_test
      TEST_DATABASE_URL: postgres://companyos:companyos@127.0.0.1:5432/companyos_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create non-superuser role for RLS
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE companyos LOGIN PASSWORD 'companyos' NOSUPERUSER NOBYPASSRLS CREATEDB;" \
            -c "CREATE DATABASE companyos_test OWNER companyos;"
          # pg_trgm is required by CRM duplicate detection (Phase 1.4); create as
          # superuser so the non-superuser app role can use it under RLS tests.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d companyos_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=companyos psql -h 127.0.0.1 -U companyos -d companyos_test \
            -c "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user;"
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
        env:
          AUTH_JWT_SECRET: ci-test-auth-secret
          AUTH_COOKIE_SECURE: "0"
          COMPANYOS_LOCAL_AUTH: "0"
          HIBP_ENABLED: "0"
          # AI uses mock provider when AI_API_KEY is unset (Phase 1.9).
          # Do not set AI_API_KEY in CI.

  typescript:
    name: TypeScript (typecheck, lint, openapi drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager" (do not also set `version` here).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:openapi-drift
      - run: pnpm check:public-compat
      - run: pnpm fixture:third-party
      - run: pnpm test:a11y
      - run: pnpm test:unit

  # Phase 1.11 — Flutter mobile shell (Linux CI). Does not require Xcode / signed iOS.
  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Android APK debug (unsigned, best-effort)
        continue-on-error: true
        run: |
          flutter build apk --debug
          echo "Signed release AAB is the required android-signed-release job (not this step)."

  # Store pipeline — required signed Android release (CI-only ephemeral upload keystore).
  # NOT a production Play upload key. See docs/clients/store-release.md.
  android-signed-release:
    name: Android signed release (AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so scripts/version_from_git.sh (git rev-list --count) is accurate.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - name: Generate CI-only upload keystore
        id: keystore
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/companyos-ci-keystore"
          # Capture KEY=value lines from the script (no secrets committed).
          # shellcheck disable=SC1091
          eval "$(apps/mobile/scripts/ci_android_keystore.sh "${OUT}")"
          echo "COMPANYOS_UPLOAD_STORE_FILE=${COMPANYOS_UPLOAD_STORE_FILE}" >> "$GITHUB_ENV"
          echo "COMPANYOS_UPLOAD_STORE_PASSWORD=${COMPANYOS_UPLOAD_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "COMPANYOS_UPLOAD_KEY_ALIAS=${COMPANYOS_UPLOAD_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "COMPANYOS_UPLOAD_KEY_PASSWORD=${COMPANYOS_UPLOAD_KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "Generated ephemeral CI upload keystore (discarded with runner)."
          echo "Play production upload key must come from GitHub secrets later — not this keystore."
      - name: Resolve version from git
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          eval "$(apps/mobile/scripts/version_from_git.sh)"
          echo "COMPANYOS_BUILD_NAME=${COMPANYOS_BUILD_NAME}" >> "$GITHUB_ENV"
          echo "COMPANYOS_BUILD_NUMBER=${COMPANYOS_BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "build-name=${COMPANYOS_BUILD_NAME} build-number=${COMPANYOS_BUILD_NUMBER}"
      - run: flutter pub get
      - name: Build signed App Bundle
        env:
          # Fake crash DSN / no live Sentry in CI.
          CRASH_DSN: fake
        run: |
          flutter build appbundle --release \
            --build-name="${COMPANYOS_BUILD_NAME}" \
            --build-number="${COMPANYOS_BUILD_NUMBER}" \
            --dart-define=CRASH_DSN=fake
      - name: Build signed APK (same CI keystore)
        run: |
          flutter build apk --release \
            --build-name="${COMPANYOS_BUILD_NAME}" \
            --build-number="${COMPANYOS_BUILD_NUMBER}" \
            --dart-define=CRASH_DSN=fake
      - name: Verify release artifacts exist
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "${AAB}"
          test -f "${APK}"
          ls -lh "${AAB}" "${APK}"
          echo "Signed Android artifacts ready (CI-only keystore; not uploaded to Play)."
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-release
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # iOS Fastlane dry-run on Linux (no Xcode / no IPA).
  ios-fastlane-dry-run:
    name: iOS Fastlane dry-run (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile/ios
      - name: bundle exec fastlane ios dry_run
        run: bundle exec fastlane ios dry_run
      - name: Note — IPA requires macOS
        run: |
          echo "gym/match IPA build skipped on Linux (no Xcode)."
          echo "Enable ios-release on a macOS runner with Apple certs — see docs/clients/store-release.md."

  # Dedicated IPA job — disabled until a macOS runner + Apple certs exist.
  # Do not fail PRs because Xcode is missing on Linux.
  ios-release:
    name: iOS signed release (macOS — skipped)
    if: false
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile/ios
      - name: fastlane ios beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
        run: |
          echo "Would run: bundle exec fastlane ios beta"
          echo "Requires MATCH_* + Apple Developer secrets — not configured in this PR."
          bundle exec fastlane ios beta

  # Phase 1.11 — Tauri desktop shell-core (pure Rust; no webkit / signed macOS).
  desktop-shell:
    name: Desktop shell-core (deep links, offline cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/shell-core
      - name: shell-core unit tests
        working-directory: apps/desktop/shell-core
        run: cargo test
      - name: Note on full Tauri GUI / signed macOS
        run: |
          echo "Full Tauri GUI build needs Linux WebKitGTK (dev) or Xcode (macOS)."
          echo "Tauri notarization / Mac App Store remain out of scope."
          echo "Tray, Alt+Space hotkey, and companyos:// deep links live in apps/desktop/src-tauri."

  # Ops gates — required: every alert has a runbook (TRD 8.5).
  ops-alert-runbooks:
    name: Ops (alert ↔ runbook link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check alert catalogue runbooks
        run: bash scripts/ops/check-alert-runbooks.sh

  # Ops gates — required: Postgres dump/restore + RLS + journal balance.
  ops-restore-drill:
    name: Ops (Postgres restore drill)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Restore drill (dump → isolated DB → RLS + journal)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ops/restore-drill.sh

  # Ops gates — required: rotate *test* secret only (MockKms).
  ops-secret-rotation:
    name: Ops (test secret rotation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rotate MockKms test secret
        run: bash scripts/ops/rotate-test-secret.sh

  # Ops gates — informational load harness (budgets, not production SLOs).
  # continue-on-error: do not flake the required gates / main Rust job.
  ops-load-harness:
    name: Ops (load harness — informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://companyos:companyos@127.0.0.1:5432/companyos_test
      TEST_DATABASE_URL: postgres://companyos:companyos@127.0.0.1:5432/companyos_test
      OPS_LOAD_HARNESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create non-superuser role for RLS
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE companyos LOGIN PASSWORD 'companyos' NOSUPERUSER NOBYPASSRLS CREATEDB;" \
            -c "CREATE DATABASE companyos_test OWNER companyos;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d companyos_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Load harness (read p95 ≤200ms / write p95 ≤400ms budgets)
        env:
          AUTH_JWT_SECRET: ci-test-auth-secret
          AUTH_COOKIE_SECURE: "0"
          COMPANYOS_LOCAL_AUTH: "0"
          HIBP_ENABLED: "0"
        run: bash scripts/ops/load-harness.sh
