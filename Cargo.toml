[workspace]
resolver = "2"
members = [
    "crates/ids",
    "crates/money",
    "crates/errors",
    "crates/telemetry",
    "crates/tenancy",
    "crates/events",
    "crates/outbox",
    "crates/authz",
    "crates/auth-token",
    "crates/testkit",
    "services/gateway",
    "services/core",
]
default-members = [
    "crates/ids",
    "crates/money",
    "crates/errors",
    "crates/telemetry",
    "crates/tenancy",
    "crates/events",
    "crates/outbox",
    "crates/authz",
    "crates/auth-token",
    "crates/testkit",
    "services/gateway",
    "services/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/blacknoix/noxara-os"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
companyos-ids = { path = "crates/ids" }
companyos-money = { path = "crates/money" }
companyos-errors = { path = "crates/errors" }
companyos-telemetry = { path = "crates/telemetry" }
companyos-tenancy = { path = "crates/tenancy" }
companyos-events = { path = "crates/events" }
companyos-outbox = { path = "crates/outbox" }
companyos-authz = { path = "crates/authz" }
companyos-auth-token = { path = "crates/auth-token" }
companyos-testkit = { path = "crates/testkit" }

# External
uuid = { version = "1.11", features = ["v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
tokio = { version = "1.42", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
proptest = "1.5"
utoipa = { version = "5.3", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
http = "1.2"
bytes = "1.9"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
hmac = "0.12"
subtle = "2.6"
totp-rs = { version = "5.6", features = ["otpauth"] }
url = "2.5"
urlencoding = "2.1"
cookie = "0.18"
time = "0.3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
