{{- if .Values.deps.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "companyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "companyos.labels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.deps.clickhouse.image }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          resources:
            {{- toYaml .Values.deps.clickhouse.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "companyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
{{- end }}
