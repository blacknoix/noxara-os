{{- if .Values.deps.opensearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "companyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: opensearch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "companyos.labels" . | nindent 8 }}
        app.kubernetes.io/component: opensearch
    spec:
      containers:
        - name: opensearch
          image: {{ .Values.deps.opensearch.image }}
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms512m -Xmx512m
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          ports:
            - name: http
              containerPort: 9200
          resources:
            {{- toYaml .Values.deps.opensearch.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "companyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: opensearch
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9200
      targetPort: http
{{- end }}
