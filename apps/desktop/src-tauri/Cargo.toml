[package]
name = "companyos-desktop"
version = "0.1.0"
description = "CompanyOS Tauri desktop shell (Phase 1.11)"
edition = "2021"
license = "Proprietary"

# Isolated from monorepo workspace — Linux GUI deps must not flake Rust/TS CI.
[workspace]

[lib]
name = "companyos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "companyos-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companyos-desktop-shell = { path = "../shell-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
